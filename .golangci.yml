version: "2"

run:
  timeout: 5m

linters:
  # the standard set: errcheck, govet, ineffassign, staticcheck, unused
  default: standard
  enable:
    - misspell
    - unconvert
  settings:
    staticcheck:
      # Keep the bug-finding (SA*) and simplification (S1*) checks; drop the
      # opinionated style nags that would force churny renames on this existing
      # codebase: QF1008 (embedded-field selectors), ST1000 (package comments),
      # ST1003 (initialism naming, e.g. GitlabApiClient -> GitlabAPIClient).
      checks:
        - all
        - -QF1008
        - -ST1000
        - -ST1003

issues:
  # Lift the silent truncation (3 per message, 50 per linter by default), which
  # turned the count into a guess: the 24 duplicate struct tags of #91 surfaced
  # as 3, and the tree reported 9 issues where there were 30. Generated files
  # stay excluded via linters.exclusions.generated.
  max-same-issues: 0
  max-issues-per-linter: 0
