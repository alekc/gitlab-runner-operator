              caCertificate:
                description: |-
                  CACertificate, when set, provides a PEM CA bundle used to verify the
                  GitLab endpoint for both the operator's API calls and every runner
                  entry's own connection. Supply it inline (value) or from a Secret or
                  ConfigMap key.
                properties:
                  configMapKeyRef:
                    description: ConfigMapKeyRef selects a key in a ConfigMap holding
                      the PEM CA bundle.
                    properties:
                      key:
                        description: Key holding the PEM CA bundle. Defaults to "ca.crt"
                          when empty.
                        type: string
                      name:
                        description: Name of the Secret or ConfigMap.
                        minLength: 1
                        type: string
                    required:
                    - name
                    type: object
                  secretKeyRef:
                    description: SecretKeyRef selects a key in a Secret holding the
                      PEM CA bundle.
                    properties:
                      key:
                        description: Key holding the PEM CA bundle. Defaults to "ca.crt"
                          when empty.
                        type: string
                      name:
                        description: Name of the Secret or ConfigMap.
                        minLength: 1
                        type: string
                    required:
                    - name
                    type: object
                  value:
                    description: |-
                      Value is an inline PEM CA bundle, supplied directly in the manifest.
                      Convenient for small bundles; prefer a Secret or ConfigMap ref when the
                      bundle is large or rotated independently of the runner spec.
                    type: string
