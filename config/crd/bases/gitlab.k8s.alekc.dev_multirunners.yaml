                          - message: project_type runner requires project_id
                            rule: self.runner_type != 'project_type' || has(self.project_id)
                        token:
                          description: |-
                            Token is the pre-created runner authentication token ("glrt-...") used in
                            bring-your-own mode. Mutually exclusive with the managed CreateOptions.
                          properties:
                            secret_key_ref:
                              description: |-
