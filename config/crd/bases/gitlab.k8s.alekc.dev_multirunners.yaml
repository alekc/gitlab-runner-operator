                                  type: boolean
                              required:
                              - name
                              type: object
                            value:
                              description: |-
                                Value is the literal token. Convenient for testing; prefer SecretKeyRef
                                in production so the token is not stored in the object spec.
                              type: string
                          type: object
                          x-kubernetes-validations:
                          - message: set either value or secret_key_ref, not both
                            rule: (has(self.value) && size(self.value) != 0) != has(self.secret_key_ref)
                      type: object
                      x-kubernetes-validations:
                      - message: one of token or create_options must be set
