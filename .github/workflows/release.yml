name: release

on:
  push:
    branches-ignore:
      - '**'
    tags:
      - '*'

jobs:
  # A tag must name a commit e2e has already passed on. Merges to main run e2e,
  # so this normally resolves in seconds against an existing run; it only fails
  # when a tag is pushed to something never tested, which is how v2.0.0-rc.1 was
  # cut 27 minutes after a refactor that replaced the admission webhook.
  verify:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Require a green e2e run for this commit
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              // Renaming e2e.yaml silently breaks this lookup and blocks every
              // release until the name is updated here too.
              workflow_id: 'e2e.yaml',
              head_sha: context.sha,
              // Filters on conclusion, so a run whose jobs were skipped (the
              // authorize gate said no) does not count as evidence.
              status: 'success',
            });
            if (data.total_count === 0) {
              const tag = context.ref.replace('refs/tags/', '');
              core.setFailed(
                `No successful e2e run for ${context.sha}. Nothing was published. ` +
                `Run "gh workflow run e2e.yaml --ref ${tag}", wait for it to pass, ` +
                `then re-run this workflow. The tag can stay as it is.`
              );
              return;
            }
            core.info(`e2e verified by run ${data.workflow_runs[0].html_url}`);

  goreleaser:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.x
          # This job imports GPG keys and publishes artifacts; do not restore a
          # build cache a less-privileged workflow could have poisoned.
          cache: false

      - name: Inject slug/short variables
        uses: rlespinasse/github-slug-action@ef93b2ea4b6405d06fd8684fc3ff795d262ecae8 # v5.7.0
        id: ref_slug

      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: latest
          args: release --clean --timeout=1h
        env:
          VERSION: ${{  steps.ref_slug.outputs.github-ref-name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # setup-go exports GOTOOLCHAIN=local and satisfied the 1.26.x wildcard
          # from the runner tool cache, so v2.0.0 shipped stdlib 1.26.5 while
          # go.mod pinned go1.26.6. auto restores the pin. See issue #49.
          GOTOOLCHAIN: auto

      - name: set up buildx
        id: buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build (and publish) main image
        env:
          DOCKER_REPO: ghcr.io/${{ github.repository_owner }}/gitlab-runner-operator
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg VERSION=${GITHUB_REF_SLUG} \
            --push \
            -t ${DOCKER_REPO}:${GITHUB_REF_SLUG} .
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg VERSION=latest \
            --push \
            -t ${DOCKER_REPO}:latest .
