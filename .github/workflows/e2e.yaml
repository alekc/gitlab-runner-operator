name: e2e

# The e2e suite stands up kind clusters and talks to a real GitLab, so it runs
# where it earns its cost: every merge to main (release.yml requires a green run
# for the tagged commit) and every same-repo PR that touches Go code. Fork PRs
# have no secrets, so a maintainer still launches those with "/launch e2e".
on:
  push:
    branches: [main]
  pull_request:
    # Deliberately unfiltered by path. e2e-gate is a required check, and a check
    # that never runs blocks a PR forever, so the workflow always starts and the
    # changes job decides whether the suite itself is worth a slot.
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
  # Target a commit with --ref (a branch or tag), not a free-form input. A run
  # records the head SHA of the ref it was dispatched on, and release.yml treats
  # that SHA as proof the commit was tested, so an input that could point
  # somewhere else would let a run vouch for a tree it never checked out.
  workflow_dispatch:

# No concurrency group. Each leg registers its runner under a tag unique to the
# run and the Kubernetes version, and pins its pipeline to that tag, so two runs
# cannot pick up each other's jobs. A shared queue would also let a pending run
# be displaced and cancelled outright, leaving a commit with no e2e evidence.

# No workflow-wide token. The e2e job runs checked-out PR code with GitLab
# secrets, so write scope is granted only to the authorize job below.
permissions: {}

jobs:
  authorize:
    # Trusted entry points run unattended: manual dispatch, a merge to main, and
    # a non-draft PR from this repo (whose branch only collaborators can push,
    # the same set the /launch gate accepts). A fork PR gets no secrets from the
    # pull_request event, so it still needs a collaborator to comment
    # "/launch e2e", which is the approval step for untrusted code.
    #
    # Dependabot is excluded even though its branches are same-repo: GitHub
    # withholds secrets from dependabot-triggered runs, so the suite could only
    # fail on GitLab auth while holding the single global slot. Review a bump
    # with "/launch e2e" instead.
    permissions:
      # The launch comment lives on a PR, so reacting to it (the rocket
      # acknowledgement) needs pull-requests: write; issues: write is not
      # sufficient for a PR comment. This also covers reading the PR head SHA.
      pull-requests: write
      issues: write
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      ( github.event_name == 'pull_request' &&
        github.event.pull_request.draft == false &&
        github.event.pull_request.user.login != 'dependabot[bot]' &&
        github.event.pull_request.head.repo.full_name == github.repository ) ||
      ( github.event.issue.pull_request != null &&
        github.event.comment.body == '/launch e2e' &&
        contains(fromJson('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) )
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
    steps:
      - name: Resolve ref to test
        id: resolve
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            // Always test the exact commit the run is recorded against, so the
            // head SHA release.yml looks up is proof of what was checked out.
            if (context.eventName === 'workflow_dispatch' ||
                context.eventName === 'push') {
              core.setOutput('ref', context.sha);
              return;
            }
            if (context.eventName === 'pull_request') {
              core.setOutput('ref', context.payload.pull_request.head.sha);
              return;
            }
            // Acknowledge the command, then test the PR's head commit.
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'rocket',
            });
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            core.setOutput('ref', pr.data.head.sha);

  # Docs and workflow-only PRs cannot break the suite, so they skip it rather
  # than spending four runners and a few minutes. Non-PR events always run.
  changes:
    needs: authorize
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      go: ${{ steps.filter.outputs.go }}
    steps:
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          set -euo pipefail
          if [ -z "${PR}" ]; then
            echo "go=true" >> "${GITHUB_OUTPUT}"
            echo "not a pull request; running the suite"
            exit 0
          fi
          files="$(gh api --paginate "repos/${REPO}/pulls/${PR}/files" --jq '.[].filename')"
          # Here-string, not a pipe: grep -q exits on first match and would
          # SIGPIPE the producer, which pipefail then reports as failure.
          if grep -qE '\.go$|^go\.(mod|sum)$' <<< "${files}"; then
            echo "go=true" >> "${GITHUB_OUTPUT}"
          else
            echo "go=false" >> "${GITHUB_OUTPUT}"
            echo "no Go changes in PR #${PR}; skipping the suite"
          fi

  # Latest patch of each recent Kubernetes minor that has a kindest/node image.
  k8s_versions:
    needs: [authorize, changes]
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b # v0.7
      - id: matrix
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          k8s_cycles="$(curl -sSfL https://endoflife.date/api/kubernetes.json | jq -rc '[sort_by(.releaseDate) | reverse | .[0:4] | .[].cycle]')"
          kind_versions="$(crane ls docker.io/kindest/node | jq -sRrc --argjson cycles "${k8s_cycles}" 'split("\n") | [.[] | match("^v((\\d+\\.\\d+)\\.\\d+)$").captures | {cycle: .[1].string, version: .[0].string}] | group_by(.cycle) | [.[] | .[-1] | {(.cycle): {"version": .version}}] | reduce .[] as $item ({}; . *= $item) | . as $versions | [$cycles | .[] | select($versions[.] != null) | $versions[.].version]')"
          echo "k8s_versions=${kind_versions}" >> "${GITHUB_OUTPUT}"
          # Pin the kind binary to its latest release so `kind load` understands
          # the newest node images the matrix selects. The node tags above come
          # from the latest kind release, and an older kind binary fails to load
          # into them with "unknown containerd config version: 4".
          kind_version="$(curl -sSfL -H "Authorization: Bearer ${GH_TOKEN}" https://api.github.com/repos/kubernetes-sigs/kind/releases/latest | jq -r .tag_name)"
          # jq prints the literal "null" (and -e/-f do not catch it) if the field
          # is ever missing; fail fast here rather than feeding "null" into the
          # kind-action version input and getting a confusing "download kind null".
          if [ -z "${kind_version}" ] || [ "${kind_version}" = "null" ]; then
            echo "could not resolve the latest kind release tag (got '${kind_version}')" >&2
            exit 1
          fi
          echo "kind_version=${kind_version}" >> "${GITHUB_OUTPUT}"
    outputs:
      k8s_versions: ${{ steps.matrix.outputs.k8s_versions }}
      kind_version: ${{ steps.matrix.outputs.kind_version }}

  e2e:
    needs: [authorize, k8s_versions]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        k8s_version: ${{ fromJson(needs.k8s_versions.outputs.k8s_versions) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.authorize.outputs.ref }}
          # PR code runs here with secrets; do not leave GITHUB_TOKEN in git config.
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.x

      - name: Create kind cluster (k8s ${{ matrix.k8s_version }})
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          version: ${{ needs.k8s_versions.outputs.kind_version }}
          cluster_name: kind
          node_image: kindest/node:v${{ matrix.k8s_version }}
          wait: 2m

      - name: Build operator image
        run: docker build -f Dockerfile.e2e -t gitlab-runner-operator:e2e .

      - name: Load image into kind
        run: kind load docker-image gitlab-runner-operator:e2e --name kind

      - name: Deploy operator (CRDs, RBAC)
        run: |
          make deploy IMG=gitlab-runner-operator:e2e
          kubectl -n gitlab-runner-operator-system rollout status \
            deploy/gitlab-runner-operator-controller-manager --timeout=300s

      - name: Run e2e suite
        env:
          GITLAB_E2E_URL: ${{ secrets.GITLAB_E2E_URL }}
          GITLAB_E2E_TOKEN: ${{ secrets.GITLAB_E2E_TOKEN }}
          GITLAB_E2E_PROJECT_ID: ${{ secrets.GITLAB_E2E_PROJECT_ID }}
          # Unique per run, attempt and matrix leg, so no two legs or runs can
          # share a tag. job-index rather than the version string because a
          # runner tag cannot contain the dots in e.g. v1.33.7.
          GITLAB_E2E_RUNNER_TAG: e2e-${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}
        run: make test-e2e

  # The one context worth marking required. Its name never changes, unlike the
  # per-version e2e legs whose matrix comes from endoflife.date, and it reports
  # on every PR, including ones the suite skips.
  e2e-gate:
    needs: [authorize, changes, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the suite result
        env:
          NEEDED: ${{ needs.changes.outputs.go }}
          AUTHORIZE: ${{ needs.authorize.result }}
          CHANGES: ${{ needs.changes.result }}
          RESULT: ${{ needs.e2e.result }}
        run: ./hack/e2e-gate.sh
