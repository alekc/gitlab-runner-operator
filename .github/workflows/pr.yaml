name: pr

on: pull_request

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: 1.26.x
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test (unit + envtest)
        run: make test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: 1.26.x
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          # Gate only issues introduced by the PR, so the pre-existing backlog
          # does not block adoption.
          only-new-issues: true

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: 1.26.x
      - name: govulncheck
        # Required gate. Binary mode (see the Makefile) since source mode panics
        # on go 1.26. setup-go sets GOTOOLCHAIN=local, which ignores the go.mod
        # toolchain directive; GOTOOLCHAIN=auto restores it so the build uses the
        # pinned patch. A failure means a reachable CVE to address.
        run: GOTOOLCHAIN=auto make govulncheck
