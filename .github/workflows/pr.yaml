name: pr

on: pull_request

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.x
      # GOTOOLCHAIN=auto on each line, as in the govulncheck job below: setup-go
      # exports GOTOOLCHAIN=local via GITHUB_ENV, and whether a workflow-level
      # env key outranks that is not specified. Per-command is unambiguous.
      - name: Build
        run: GOTOOLCHAIN=auto go build ./...
      - name: Vet
        run: GOTOOLCHAIN=auto go vet ./...
      - name: Test (unit + envtest)
        run: GOTOOLCHAIN=auto make test
      - name: Test (cve-report)
        # A silent bug here closes the tracking issue and hides live CVEs, so
        # the script does not ship without regression cover. gh is stubbed.
        run: ./hack/cve-report_test.sh
      - name: Test (runner-release-watch)
        # Same reasoning: a silent bug here means an upstream release goes
        # unnoticed. gh and curl are stubbed.
        run: ./hack/runner-release-watch_test.sh
      - name: Test (e2e-gate)
        # e2e-gate is the required check, so a bug that reads a skip as a pass
        # would let a PR merge with a suite that never ran.
        run: ./hack/e2e-gate_test.sh

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.x
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          # Gate only issues introduced by the PR. The tree lints clean as of
          # #91, so this no longer hides a backlog; it absorbs findings a future
          # linter bump adds on lines the PR did not touch. Not a full-tree
          # gate: make lint is that.
          only-new-issues: true

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.x
      - name: govulncheck
        # Required gate. Binary mode (see the Makefile) since source mode panics
        # on go 1.26. setup-go sets GOTOOLCHAIN=local, which ignores the go.mod
        # toolchain directive; GOTOOLCHAIN=auto restores it so the build uses the
        # pinned patch. A failure means a reachable CVE to address.
        run: GOTOOLCHAIN=auto make govulncheck

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.x
      - name: Reference matches the API types
        # Regenerates docs/reference/api.md into a temp file and diffs. An API
        # change with a stale reference fails here rather than shipping wrong
        # field docs to the site.
        run: GOTOOLCHAIN=auto make docs-verify
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.x
      - name: Install the docs toolchain
        run: pip install -r docs/requirements.txt
      - name: Build the site
        # strict mode: a broken internal link or a nav entry pointing at a
        # missing file fails the build.
        run: mkdocs build --strict
