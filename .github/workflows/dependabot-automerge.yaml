name: dependabot-automerge

# Turn on auto-merge for Dependabot SECURITY updates only, so a CVE fix lands as
# soon as the required checks pass instead of waiting to be noticed by hand. It
# is the gap #49 fell through. Ordinary version updates stay manual.
#
# pull_request_target because a pull_request run on a Dependabot branch gets a
# read-only token. That trigger runs privileged against the base repo, so this
# workflow never checks out or executes PR code; it only reads metadata.
on: pull_request_target

permissions: {}

concurrency:
  group: dependabot-automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  automerge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      # contents: write to merge, pull-requests: write to set auto-merge,
      # security-events: read for the alert lookup below.
      contents: write
      pull-requests: write
      security-events: read
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          # Populates ghsa-id / alert-state / cvss, which is the only reliable
          # way to tell a security update from an ordinary version bump.
          alert-lookup: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge
        # Security fixes only, and never a major: a major can carry breaking API
        # changes that the unit and envtest suites will not necessarily catch.
        if: >-
          steps.meta.outputs.ghsa-id != '' &&
          steps.meta.outputs.update-type != 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          GHSA: ${{ steps.meta.outputs.ghsa-id }}
          DEPS: ${{ steps.meta.outputs.dependency-names }}
        run: |
          set -euo pipefail
          echo "security update ${GHSA} for ${DEPS}; enabling auto-merge"
          # Fails when "Allow auto-merge" is off in repository settings, which is
          # the intended loud failure rather than a silent no-merge.
          gh pr merge --auto --squash "${PR_URL}"

      - name: Explain why this PR was left alone
        if: >-
          steps.meta.outputs.ghsa-id == '' ||
          steps.meta.outputs.update-type == 'version-update:semver-major'
        env:
          GHSA: ${{ steps.meta.outputs.ghsa-id }}
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
        run: |
          if [ -z "${GHSA}" ]; then
            echo "not a security update; leaving for manual review"
          else
            echo "security update ${GHSA} but ${UPDATE_TYPE}; majors stay manual"
          fi
